name: CPU geometry and release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: python -m pip install -r requirements-core.txt
      - run: bash scripts/build_native.sh
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python examples/estimate_pose.py
      - run: python scripts/audit_release.py
      - run: |
          for script in scripts/*.sh; do bash -n "$script"; done
