  <title id="title">PiPER Manipulation: from RGB-D to robot action</title>
  <desc id="desc">Schematic overview: a wrist RGB-D camera, YOLO box prompts and MobileSAMv2 masks, cuboid hypotheses and bounded refinement, then pose acceptance and guarded MoveIt control.</desc>
