  <text x="32" y="44" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#15283c">From RGB-D to robot action.</text>
  <text x="32" y="70" font-size="14" fill="#536779" font-family="Arial, Helvetica, sans-serif">Known-size cuboids · Wrist camera · Metric 6-DoF pose · PiPER manipulation</text>
