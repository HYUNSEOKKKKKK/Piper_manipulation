# MoveIt 이 궤적 시간 파라미터화에 쓰는 속도/가속도 한계.
# 위치 한계(lower/upper)는 URDF 값을 그대로 따른다.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1

joint_limits:
